# PLACEHOLDER CONTENT - see warmup.yaml for the field guide. Review before use.

# --- session open / close ---
- id: session-open
  name: ""
  role: session
  families: []
  seconds: {min: 10, max: 30}
  intro: Welcome to Clockwork Coach. This is a forty-five minute session. Keep it gentle, keep your feet quiet, and stop if anything hurts.
  tags: {impact: low, noise: quiet, joints: []}

- id: session-close
  name: ""
  role: session
  families: []
  seconds: {min: 10, max: 30}
  intro: That's the session. Forty-five minutes, done. Good work. Have some water.
  tags: {impact: low, noise: quiet, joints: []}

# --- rest and recovery ---
- id: rest-breathe
  name: Rest
  role: rest
  families: [rest]
  seconds: {min: 10, max: 120}
  intro: ""
  tags: {impact: low, noise: quiet, joints: []}

- id: recovery-walk
  name: Recovery
  role: rest
  families: [recovery]
  seconds: {min: 30, max: 300}
  intro: Easy march in place. Catch your breath.
  tags: {impact: low, noise: quiet, joints: [knees]}

# --- cool-down ---
- id: slow-march-down
  name: Slow march
  role: cooldown
  families: [cooldown]
  seconds: {min: 30, max: 300}
  intro: Slow it right down. Breathe in through your nose, out through your mouth.
  tags: {impact: low, noise: quiet, joints: [knees]}

- id: quad-stretch
  name: Standing thigh stretch
  role: cooldown
  families: [stretch]
  seconds: {min: 30, max: 120}
  intro: Hold a wall. Bend one knee and hold your ankle or pant leg behind you.
  easier: Rest your foot on a chair behind you instead.
  switch: Switch sides.
  tags: {impact: low, noise: quiet, joints: [knees]}

- id: hamstring-stretch
  name: Hamstring stretch
  role: cooldown
  families: [stretch]
  seconds: {min: 30, max: 120}
  intro: One heel forward, toes up. Hinge at the hips with a long, straight back.
  switch: Switch legs.
  tags: {impact: low, noise: quiet, joints: [back]}

- id: calf-stretch
  name: Wall calf stretch
  role: cooldown
  families: [stretch]
  seconds: {min: 30, max: 120}
  intro: Hands on the wall, one foot back, heel down.
  switch: Switch legs.
  tags: {impact: low, noise: quiet, joints: [ankles]}

- id: chest-opener
  name: Chest opener
  role: cooldown
  families: [stretch]
  seconds: {min: 30, max: 90}
  intro: Clasp your hands behind you, or hold a door frame, and gently open your chest.
  tags: {impact: low, noise: quiet, joints: [shoulders]}

- id: shoulder-stretch
  name: Shoulder stretch
  role: cooldown
  families: [stretch]
  seconds: {min: 30, max: 90}
  intro: Bring one arm across your chest and hold it with the other.
  switch: Switch arms.
  tags: {impact: low, noise: quiet, joints: [shoulders]}

- id: side-reach-stretch
  name: Side reach stretch
  role: cooldown
  families: [stretch]
  seconds: {min: 30, max: 90}
  intro: Reach one arm overhead and lean gently to the side.
  switch: Switch sides.
  tags: {impact: low, noise: quiet, joints: [back]}

- id: deep-breathing
  name: Breathing
  role: cooldown
  families: [breathing]
  seconds: {min: 30, max: 300}
  intro: Stand or sit comfortably. Breathe in for four, and out for six.
  cues:
    - {at: 40, text: In for four. Out for six.}
    - {at: 90, text: Let your shoulders drop.}
  tags: {impact: low, noise: quiet, joints: []}

# --- posterior-chain cool-down stretches (proposed by Instinct, revised) ---
# Fixed 90 s, 45 s a side, countdown into each switch and the end.
- id: cool-calf-achilles
  name: Calf and Achilles stretch
  role: cooldown
  families: [stretch]
  seconds: {min: 90, max: 90}
  intro: Hands on a wall, one foot back, heel down. Back leg straight, then let the knee bend a little.
  easier: Shorten the step.
  switch: Switch sides.
  countdown: true
  tags: {impact: low, noise: quiet, joints: [ankles]}

- id: cool-chair-hamstring
  name: Chair hamstring stretch
  role: cooldown
  families: [stretch]
  seconds: {min: 90, max: 90}
  intro: Hold a wall for balance. One heel on a low, sturdy chair. Hinge forward until you feel a gentle pull.
  easier: Use a lower seat.
  switch: Switch legs.
  countdown: true
  tags: {impact: low, noise: quiet, joints: [back]}

- id: cool-back-fold
  name: Soft forward fold
  role: cooldown
  families: [stretch]
  seconds: {min: 90, max: 90}
  intro: Feet hip width, knees bent. Fold forward with your hands on your thighs or a chair. Breathe slowly.
  easier: Fold less.
  cues:
    - {at: -16, text: "Come up slowly, one vertebra at a time."}
  countdown: true
  tags: {impact: low, noise: quiet, joints: [back]}

- id: cool-wall-hang
  name: Wall back stretch
  role: cooldown
  families: [stretch]
  seconds: {min: 90, max: 90}
  intro: Hands on a wall at hip height, feet walked back, hips pushing away with a long back.
  easier: Walk your feet in.
  countdown: true
  tags: {impact: low, noise: quiet, joints: [back, shoulders]}
